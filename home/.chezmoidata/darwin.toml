# Bootstrap dependencies; the full Homebrew environment remains in Brewfile.
[packages.darwin]
bootstrap_formulae = ["aria2", "fnm", "jq", "starship", "yq"]
orchard = [
    "chatgpt",
    "cursor",
    "firefox",
    "ghostty",
    "google-chrome",
    "ollama-app",
    "visual-studio-code",
    "zed",
]

[environments.darwin]
# Homebrew
HOMEBREW_NO_ANALYTICS = "1"

# Enable Diffuse's JNA access while remaining compatible with older JDKs.
DIFFUSE_OPTS = "-XX:+IgnoreUnrecognizedVMOptions --enable-native-access=ALL-UNNAMED"
