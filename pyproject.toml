[project]
name = "dotfiles"
version = "0.0.0"
requires-python = ">=3.11"

[dependency-groups]
dev = [
    "basedpyright==1.38.2",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "tomlkit==0.13.3",
]

[tool.uv]
package = false

[tool.ruff]
extend-exclude = ["docs/src/agent-skills"]

[tool.basedpyright]
include = ["app-settings", "tests"]
exclude = ["**/node_modules", "**/__pycache__", "**/.venv"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
